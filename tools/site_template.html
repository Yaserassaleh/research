<title>GCC FI Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: left rail of research sections + one work surface; dense tables, profile pages with a sticky section index. */
:root{
  --paper:#f5f5f8; --surface:#ffffff; --sunk:#eeedf4; --ink:#1c1b2e; --muted:#5d5b73; --faint:#8a889e;
  --line:#dfdeea; --line-strong:#c9c7da;
  --accent:#4a3fc4; --accent-ink:#ffffff; --accent-soft:#ebe9fb;
  --ok:#17784a; --ok-soft:#e3f3ea; --warn:#9a5b00; --warn-soft:#fbf0dc; --bad:#b3261e; --bad-soft:#fbe7e5; --na:#6e6c84; --na-soft:#eeedf3;
  --t1:#4a3fc4; --t2:#2f7d8c; --t3:#8a889e;
  --f-display:"Source Serif 4", "Iowan Old Style", Georgia, serif;
  --f-ui:"DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:5px; --shadow:0 1px 2px rgba(28,27,46,.06), 0 6px 24px rgba(28,27,46,.08);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11111c; --surface:#191928; --sunk:#202032; --ink:#ecebf6; --muted:#a6a4bd; --faint:#7d7b95;
  --line:#2b2a40; --line-strong:#3a3954; --accent:#a99fff; --accent-ink:#14132a; --accent-soft:#272450;
  --ok:#5fcf93; --ok-soft:#173226; --warn:#f1b357; --warn-soft:#382a12; --bad:#ff8a80; --bad-soft:#3d1c1b; --na:#a6a4bd; --na-soft:#24243a;
  --t1:#a99fff; --t2:#6cc3d1; --t3:#7d7b95; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11111c; --surface:#191928; --sunk:#202032; --ink:#ecebf6; --muted:#a6a4bd; --faint:#7d7b95;
  --line:#2b2a40; --line-strong:#3a3954; --accent:#a99fff; --accent-ink:#14132a; --accent-soft:#272450;
  --ok:#5fcf93; --ok-soft:#173226; --warn:#f1b357; --warn-soft:#382a12; --bad:#ff8a80; --bad-soft:#3d1c1b; --na:#a6a4bd; --na-soft:#24243a;
  --t1:#a99fff; --t2:#6cc3d1; --t3:#7d7b95; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
button{font:inherit;color:inherit}
.num,td.n,.kpi .v{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:12px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;border-right:1px solid var(--line);background:var(--surface);padding:18px 14px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 6px}
.brand b{font-family:var(--f-display);font-size:19px;font-weight:600;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:var(--r);color:var(--ink);font-weight:500}
.nav a:hover{background:var(--sunk);text-decoration:none}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.nav a small{color:var(--faint);font-weight:400;font-variant-numeric:tabular-nums}
.rail .foot{margin-top:auto;color:var(--faint);font-size:11.5px;padding:0 6px;line-height:1.45}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-block:10px;padding-inline:24px;display:flex;gap:12px;align-items:center}
.search{position:relative;flex:1;max-width:640px}
.search #q{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);color:var(--ink);font:inherit}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--faint)}
.search kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-family:var(--f-mono);font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:3px;padding:0 5px}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);box-shadow:var(--shadow);max-height:60vh;overflow-y:auto;z-index:30}
.results a{display:flex;gap:10px;align-items:baseline;padding:8px 12px;color:var(--ink);border-bottom:1px solid var(--line)}
.results a:hover,.results a.sel{background:var(--accent-soft);text-decoration:none}
.results .k{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;width:74px;flex:none}
.results .s{color:var(--muted);font-size:12.5px}
.cmpbtn{white-space:nowrap;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r);padding:8px 12px;cursor:pointer;font-weight:500}
.cmpbtn b{color:var(--accent)}
.menu{display:none}
.page{padding-block:24px 64px;padding-inline:24px;max-width:1280px;width:100%}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:600;font-size:30px;line-height:1.15;letter-spacing:-.01em}
h2{font-family:var(--f-display);font-weight:600;font-size:21px;line-height:1.25}
h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
p{margin:0}
.lede{color:var(--muted);max-width:72ch;margin-top:6px}
.stack{display:flex;flex-direction:column;gap:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.section{display:flex;flex-direction:column;gap:12px;padding-top:22px;border-top:1px solid var(--line)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.small{font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;user-select:none}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .c{font-family:var(--f-mono);font-size:11px;opacity:.75}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:3px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{color:var(--ok);background:var(--ok-soft)}.p-warn{color:var(--warn);background:var(--warn-soft)}.p-bad{color:var(--bad);background:var(--bad-soft)}.p-na{color:var(--na);background:var(--na-soft)}
.tier{font-weight:700;font-size:11.5px;padding:2px 8px;border-radius:3px;color:var(--accent-ink)}
.tier.t1{background:var(--t1)}.tier.t2{background:var(--t2)}.tier.t3{background:var(--t3)}
.s{display:inline-block;font-family:var(--f-mono);font-size:10.5px;line-height:1;padding:2px 4px;margin-left:3px;border-radius:3px;background:var(--accent-soft);color:var(--accent);cursor:pointer;vertical-align:2px;border:0}
.s:hover{background:var(--accent);color:var(--accent-ink)}
.pop{position:fixed;z-index:50;width:min(380px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.pop .t{font-weight:600}
.pop dl{display:grid;grid-template-columns:86px 1fr;gap:2px 10px;margin:0;font-size:12.5px}
.pop dt{color:var(--faint)}.pop dd{margin:0;word-break:break-word}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--sunk);text-align:left;font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
th.sort{cursor:pointer}th.sort:hover{color:var(--ink)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
td.n,th.n{text-align:right;white-space:nowrap}
.iname{font-weight:600;color:var(--ink)}
.iname:hover{color:var(--accent)}
.sub{display:block;color:var(--faint);font-size:12px;font-weight:400}
.ar{font-family:"Geeza Pro","Noto Naskh Arabic","Segoe UI",var(--f-ui);direction:rtl;unicode-bidi:isolate;text-align:left}
td.def{min-width:300px}
td.inst{min-width:230px}
td.typ{min-width:170px}
#dirtable table td.n{width:1%}
.filters{display:flex;flex-direction:column;gap:10px;padding:14px 16px}
.filters .row{gap:8px}
.flabel{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);width:84px;flex:none}
select,input[type=text],input[type=search]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);padding:6px 9px}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r);padding:6px 11px;cursor:pointer;font-size:13px;font-weight:500}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hero{display:flex;flex-direction:column;gap:10px}
.idline{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;color:var(--muted);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.kpi{padding:12px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint)}
.kpi .v{font-size:20px;font-weight:600;letter-spacing:-.01em}
.kpi .d{font-size:12px;color:var(--muted)}
.kpi .v.nd{font-size:14px;color:var(--na);font-weight:500}
.profile{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:28px;align-items:start}
.toc{position:sticky;top:76px;display:flex;flex-direction:column;gap:2px;font-size:13px}
.toc a{color:var(--muted);padding:4px 10px;border-left:2px solid var(--line)}
.toc a:hover{color:var(--ink);border-left-color:var(--accent);text-decoration:none}
dl.facts{display:grid;grid-template-columns:170px minmax(0,1fr);gap:9px 18px;margin:0}
dl.facts dt{color:var(--faint);font-size:12.5px}
dl.facts dd{margin:0;min-width:0}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.person{display:flex;flex-direction:column;gap:6px;padding:13px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);color:var(--ink)}
.person:hover{border-color:var(--accent);text-decoration:none}
.person .nm{font-weight:600}
.person .tt{color:var(--muted);font-size:13px}
.capgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.cap{padding:12px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.cap .h{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:600}
.timeline{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;padding:9px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .dt{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
ul.ev-list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.bar{height:8px;border-radius:2px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.score{display:grid;grid-template-columns:150px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:13px}
.slider{display:grid;grid-template-columns:140px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13px}
input[type=range]{accent-color:var(--accent);width:100%}
.cov td{text-align:center;font-family:var(--f-mono);font-size:11.5px;padding:6px 6px}
.cov td.l{text-align:left;font-family:var(--f-ui);font-size:13px}
.c-std{color:var(--ok)}.c-old{color:var(--warn)}.c-nd{color:var(--na)}.c-miss{color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.note{border-left:3px solid var(--line-strong);padding:4px 0 4px 12px;color:var(--muted);font-size:13px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.cmpgrid th{position:static;text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink);background:var(--surface);vertical-align:bottom}
.cmpgrid td.l{color:var(--faint);font-size:12.5px;white-space:nowrap;width:170px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.stat{padding:14px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat b{display:block;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat span{font-size:12px;color:var(--muted)}
.prose{max-width:78ch;display:flex;flex-direction:column;gap:10px}
.prose ul,.prose ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.check{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.check input{accent-color:var(--accent)}
.mob-only{display:none}
@media (max-width: 1300px){ .hide-l{display:none} }
@media (max-width: 980px){
  .profile{grid-template-columns:minmax(0,1fr)}.toc{display:none}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width: 760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;inset:0 auto 0 0;width:260px;z-index:40;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow);padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .rail.open{transform:none}
  .menu{display:inline-flex;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r);padding:7px 10px;cursor:pointer}
  .top{padding-inline:16px}.page{padding-inline:16px}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  dl.facts{grid-template-columns:minmax(0,1fr)}dl.facts dt{margin-top:6px}
  h1{font-size:24px}
  .cmpbtn span{display:none}
  .search kbd{display:none}
  .score,.slider{grid-template-columns:110px minmax(0,1fr) 34px}
  .ev{grid-template-columns:minmax(0,1fr);gap:2px}
  .hide-m{display:none}
  .mob-only{display:block}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="app">
  <aside class="rail" id="rail">
    <div class="brand"><b>GCC FI Intelligence</b><span>ARTA partnerships research</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot" id="railfoot"></div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="menu" id="menuBtn" aria-label="Open navigation">☰</button>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search banks, firms, executives, subsidiaries…" autocomplete="off" aria-label="Search">
        <kbd>/</kbd>
        <div class="results" id="results" hidden></div>
      </div>
      <button class="cmpbtn" id="cmpBtn"><span>Compare </span><b id="cmpCount">0</b></button>
    </header>
    <main class="page" id="page"></main>
  </div>
</div>
<div class="pop" id="pop" hidden></div>

<script id="data" type="application/json">__DATA_JSON__</script>
<script>
"use strict";
const DB = JSON.parse(document.getElementById('data').textContent);
const M = DB.meta;
const INST = DB.institutions;
const BYID = Object.fromEntries(INST.map(i => [i.id, i]));
const SRC = DB.sources;
const PEOPLE = INST.flatMap(i => i.people.map(p => Object.assign(p, {inst: i})));
const PBYID = Object.fromEntries(PEOPLE.map(p => [p.person_id, p]));
const CC = {AE:"UAE", SA:"Saudi Arabia", QA:"Qatar", KW:"Kuwait", BH:"Bahrain", OM:"Oman"};
const CAPS = M.cap_fields, CAPL = M.cap_labels;
const KPI_DEF = [
  ["total_assets","Total assets"],["customer_deposits","Customer deposits"],["net_loans","Net loans / financing"],
  ["operating_income","Operating income"],["net_profit","Net profit"],["aum","Assets under management"],
  ["aua","Assets under administration"],["wealth_client_assets","Wealth client assets"],["customers","Customers"],["investing_users","Investing users"]];
const MLABEL = Object.fromEntries(KPI_DEF.concat([["gross_loans","Gross loans"],["total_equity","Total equity"],["employees","Employees"],["branches","Branches"]]));
const store = {get(k,d){try{const v=localStorage.getItem('gccfi.'+k);return v?JSON.parse(v):d}catch(e){return d}}, set(k,v){try{localStorage.setItem('gccfi.'+k,JSON.stringify(v))}catch(e){}}};
const S = {compare: store.get('compare', []).filter(id => BYID[id]), weights: Object.assign({}, M.weights, store.get('weights', {})),
  dir: {q:"", c:[], cat:"", model:"", size:"", tier:"", caps:[], sort:"assets", desc:true},
  ppl: {q:"", f:"", c:"", st:""}, src: {q:"", tier:"", inst:""}, prio: {c:"", cat:""}};

const esc = s => (s===null||s===undefined) ? "" : String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);
const route = h => '#' + h;
function fmtUSD(bn){ if(bn===null||bn===undefined||isNaN(bn)) return null;
  if (Math.abs(bn) >= 1) return 'USD ' + bn.toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1}) + 'bn';
  return 'USD ' + (bn*1000).toLocaleString('en-US',{maximumFractionDigits:0}) + 'm'; }
function fmtNum(n){ if(n===null||n===undefined) return null; if(n>=1e6) return (n/1e6).toLocaleString('en-US',{maximumFractionDigits:2})+'m'; if(n>=1e3) return Math.round(n).toLocaleString('en-US'); return String(n); }
function fmtLocal(k){ if(!k || k.value===undefined || k.value===null) return ''; const v=k.value_abs; if(!k.currency) return fmtNum(v);
  const b=v/1e9; return k.currency+' '+(Math.abs(b)>=1? b.toLocaleString('en-US',{maximumFractionDigits:1})+'bn' : (v/1e6).toLocaleString('en-US',{maximumFractionDigits:1})+'m'); }
function fmtDate(d){ if(!d) return ''; const m=String(d).match(/^(\d{4})-(\d{2})(?:-(\d{2}))?/); if(!m) return esc(d);
  const mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m[2]-1]; return (m[3]? (+m[3])+' ':'')+mo+' '+m[1]; }
function pill(st){ if(!st) return ''; const s=String(st);
  const cls = /^Verified|^Yes$|^Live$/.test(s)?'p-ok': /Conflict|Departed/.test(s)?'p-bad': /Requires|Unclear|Announced|MoU|Partial|approx/i.test(s)?'p-warn':'p-na';
  return `<span class="pill ${cls}">${esc(s)}</span>`; }
function tierTag(t){ const n=(t||'').slice(-1); return `<span class="tier t${n}">${esc(t)}</span>`; }
function srcs(ids){ if(!ids||!ids.length) return ''; return ids.map(id => SRC[id] ? `<button class="s" data-src="${esc(id)}" aria-label="Source ${esc(id.split(':')[1])}">${esc(id.split(':')[1])}</button>` : '').join(''); }
function instLink(i, extra){ return `<a class="iname" href="${route('i.'+i.id)}">${esc(i.name)}</a>${extra||''}`; }
function personLink(p){ return `<a class="iname" href="${route('p.'+p.person_id.replace(':','.'))}">${esc(p.name)}</a>`; }
function kpiUSD(i,k){ const v=i.kpi[k]; return v && v.usd_bn!=null ? v.usd_bn : null; }
function kpiCell(i,k){ const v=i.kpi[k]; if(!v) return '<span class="faint">—</span>';
  if(v.disclosure) return `<span class="faint small">${v.disclosure==='Not publicly disclosed'?'Not disclosed':'Not found'}</span>`;
  const t = k==='customers'||k==='investing_users' ? fmtNum(v.value_abs) : fmtUSD(v.usd_bn);
  return (t||'—') + (v.standard_period ? '' : `<span class="sub" title="Not at the standard date: ${esc(v.period_label)}">${esc(shortPeriod(v))}</span>`); }
function shortPeriod(v){ const l=v.period_label||v.period_end||''; return l.replace(/^(\d{1,2}) (\w{3}) (\d{4})$/,'$2 $3'); }
function score(i, W){ W=W||S.weights; const c=i.score.components; let tot=0, wsum=0; for(const k in W){ wsum+=W[k]; tot+= W[k]*(c[k]?c[k].score:0)/5; } return wsum? Math.round(tot*100/wsum*10)/10 : 0; }
function tierOf(s){ return s>=65?'Tier 1': s>=50?'Tier 2':'Tier 3'; }

  box.hidden=false; }

function drawDirTable(){

   <div class="prose small"><b>What each component measures (0–5)</b><ul>
    <li><b>Wealth franchise</b>: private banking (1.5), an affluent/priority tier (1), asset management (1), brokerage (0.75), advisory or discretionary service (0.75).</li>
    <li><b>Scale</b>: banks by total assets (≥150bn = 5, 75–150 = 4, 30–75 = 3, 10–30 = 2, 3–10 = 1, under 3bn = 0.5); capital arms and non-banks by AUM, AUA or client assets (≥50bn = 5, 20–50 = 4, 5–20 = 3, 1–5 = 2, under 1bn or undisclosed = 1). USD.</li>
    <li><b>Digital-investing gap</b>: no online investing found = 5; investing app without model portfolios = 4; already offers model portfolios/robo = 2; one point less if a named wealth-tech vendor is in place.</li>
    <li><b>Momentum</b>: dated wealth/digital launches and partnerships in 2025–2026 (none = 1, 1–2 = 2, 3–4 = 3, 5–7 = 4, 8+ = 5).</li>
    <li><b>Product-shelf fit</b>: what ARTA's shelf would add: no private markets (2), no model portfolios (2), no structured products (1); capped at 2 if there is little wealth activity to attach to.</li>
    <li><b>Access</b>: relationship status from the original workbook (live partner 5 … none 1), plus one if two or more verified wealth/digital decision-makers are named.</li></ul>
    <p>Tier 1 ≥ 65, Tier 2 ≥ 50. Flags (Islamic shelf, KSA licensing, competing product) are shown but not scored.</p></div></div>
  <div class="panel filters"><div class="row"><span class="flabel">Show</span>
   <select id="prc" aria-label="Market"><option value="">All markets</option>${Object.keys(CC).map(k=>`<option value="${k}" ${S.prio.c===k?'selected':''}>${CC[k]}</option>`).join('')}</select>
   <select id="prcat" aria-label="Category"><option value="">All categories</option>${[...new Set(INST.map(i=>i.category))].map(c=>`<option ${S.prio.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div></div>
  <div id="prtable"></div></div>`;
}
function drawPrio(){ const keys=Object.keys(M.weights);
  const rows=INST.filter(i=>(!S.prio.c||i.country===S.prio.c)&&(!S.prio.cat||i.category===S.prio.cat)).map(i=>({i,s:score(i)})).sort((a,b)=>b.s-a.s);
  $('prtable').innerHTML=`<div class="tbl-wrap"><table><thead><tr><th class="n">#</th><th>Institution</th><th class="n">Score</th><th>Tier</th>${keys.map(k=>`<th class="n hide-m">${k}</th>`).join('')}<th class="hide-m">Flags</th></tr></thead><tbody>
   ${rows.map(({i,s},ix)=>`<tr><td class="n faint">${ix+1}</td><td>${instLink(i)}<span class="sub">${CC[i.country]} · ${esc(i.type)}</span></td><td class="n"><b>${s.toFixed(1)}</b></td><td>${tierTag(tierOf(s))}</td>
   ${keys.map(k=>`<td class="n hide-m" title="${esc(i.score.components[k].why)}">${i.score.components[k].score.toFixed(1)}</td>`).join('')}<td class="hide-m small">${(i.score.flags||[]).map(esc).join('<br>')}</td></tr>`).join('')}</tbody></table></div>`; }
function bindPriorities(){ Object.keys(M.weights).forEach(k=>{ $('w_'+k).oninput=e=>{ S.weights[k]=+e.target.value; $('wv_'+k).textContent=e.target.value; store.set('weights',S.weights); drawPrio(); }; });
  $('wreset').onclick=()=>{ S.weights=Object.assign({},M.weights); store.set('weights',{}); render(); };
  $('prc').onchange=e=>{S.prio.c=e.target.value;drawPrio();}; $('prcat').onchange=e=>{S.prio.cat=e.target.value;drawPrio();}; drawPrio(); }

function vCoverage(){
  const cols=[["total_assets","Assets"],["customer_deposits","Deposits"],["net_loans","Loans"],["operating_income","Op. income"],["net_profit","Net profit"],["aum","AUM"],["customers","Customers"]];
  const cell=(i,k)=>{const v=i.kpi[k]; if(!v) return '<td class="c-miss" title="Not recorded">—</td>'; if(v.disclosure) return `<td class="c-nd" title="${esc(v.disclosure)}: ${esc(v.where_checked)}">ND</td>`; return v.standard_period?'<td class="c-std" title="At standard period">●</td>':`<td class="c-old" title="${esc(v.period_label)}">◐</td>`;};
  const planned=Object.entries(M.universe.batches).flatMap(([b,ids])=>ids.map(id=>({id,b})));
  const pending=planned.filter(x=>!BYID[x.id]);
  const st=(arr,f)=>arr.filter(f).length;
  return `<div class="stack"><div class="hero"><h1>Coverage and data quality</h1><p class="lede">What is complete, what is outstanding, which fields are not publicly disclosed, and where sources disagree.</p></div>
  <div class="statgrid">
   <div class="stat"><b>${INST.length}/${planned.length}</b><span>Institutions researched</span></div>
   <div class="stat"><b>${st(INST,i=>i.research_status==='Complete')}</b><span>Complete profiles</span></div>
   <div class="stat"><b>${st(PEOPLE,p=>p.role_status==='Verified current')}</b><span>People verified in role</span></div>
   <div class="stat"><b>${st(PEOPLE,p=>p.role_status!=='Verified current')}</b><span>People needing a check</span></div>
   <div class="stat"><b>${(()=>{const ms=INST.flatMap(i=>i.metrics); const f=ms.filter(m=>m.auto_check==='found').length; return ms.length? Math.round(f/ms.length*100)+'%':'—';})()}</b><span>Figures machine-confirmed in their cited source</span></div>
   <div class="stat"><b>${DB.discrepancies.length}</b><span>Discrepancies logged</span></div>
   <div class="stat"><b>${DB.open_items.length}</b><span>Open items</span></div></div>
  <div class="section"><h3>Field availability</h3><div class="legend"><span class="c-std">● at standard period</span><span class="c-old">◐ other period</span><span class="c-nd">ND not publicly disclosed (checked)</span><span class="c-miss">— not recorded</span></div>
  <div class="tbl-wrap"><table class="cov"><thead><tr><th>Institution</th>${cols.map(c=>`<th>${c[1]}</th>`).join('')}<th>People</th><th>Sources</th><th>Status</th></tr></thead><tbody>
   ${INST.slice().sort((a,b)=>a.country.localeCompare(b.country)||a.name.localeCompare(b.name)).map(i=>`<tr><td class="l">${instLink(i)}<span class="sub">${CC[i.country]} · ${esc(i.category)}</span></td>${cols.map(c=>cell(i,c[0])).join('')}<td>${i.counts.verified_people}/${i.counts.people}</td><td>${i.counts.sources}</td><td>${pill(i.research_status==='Complete'?'Complete':'Partial')}</td></tr>`).join('')}
  </tbody></table></div></div>
  ${pending.length?`<div class="section"><h3>Outstanding research (${pending.length})</h3><p class="small muted">${pending.map(x=>esc(M.universe.names[x.id]||x.id)).join(' · ')}</p></div>`:''}
  <div class="section"><h3>Corrections to the 7 Oct 2026 workbook</h3>
   <p class="small muted">Structural fixes to the original file, then a summary of field-by-field reconciliation. Every row is in the workbook's Correction log.</p>
   <div class="tbl-wrap"><table><thead><tr><th>Area</th><th>Item</th><th>What was wrong</th><th>Finding</th><th>Now</th></tr></thead><tbody>
   ${(M.structural_corrections||[]).map(c=>`<tr><td class="small">${esc(c.area)}</td><td class="small"><b>${esc(c.item)}</b></td><td class="small muted">${esc(c.original)}</td><td>${pill(c.finding)}</td><td class="small">${esc(c.now)}</td></tr>`).join('')}
   </tbody></table></div>
   ${(()=>{const by={}; DB.corrections.forEach(c=>{by[c.finding]=(by[c.finding]||0)+1}); const ks=Object.keys(by); return ks.length?`<div class="row">${ks.map(k=>`<span class="tag">${esc(k)}: ${by[k]}</span>`).join('')}<span class="small muted">field and person checks across ${new Set(DB.corrections.map(c=>c.institution_id)).size} institutions from the original workbook</span></div>`:''})()}
  </div>
  <div class="section"><h3>Discrepancies (${DB.discrepancies.length})</h3>${DB.discrepancies.length?`<div class="tbl-wrap"><table><thead><tr><th>Institution</th><th>Field</th><th>Detail</th><th>Resolution</th></tr></thead><tbody>${DB.discrepancies.map(d=>`<tr><td class="small">${BYID[d.institution_id]?instLink(BYID[d.institution_id]):esc(d.institution)}</td><td class="small"><b>${esc(d.field)}</b></td><td class="small">${esc(d.detail)}${srcs(d.source_ids)}</td><td class="small muted">${esc(d.resolution||'Unresolved')}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">None.</p>'}</div>
  <div class="section"><h3>Excluded from the universe, and why</h3><ul class="ev-list small">${(M.universe.excluded_watchlist||[]).map(x=>`<li><b>${esc(x.name)}</b>: ${esc(x.reason)}</li>`).join('')}</ul></div>
  </div>`;
}

function vSources(){
  const f=S.src; return `<div class="stack"><div class="hero"><h1>Source register</h1><p class="lede">Every source cited anywhere in the database, with tier, publication date and the date it was checked. Tier 1 = audited statements and exchange filings; 5 = news used for corroboration.</p></div>
  <div class="panel filters"><div class="row"><span class="flabel">Filter</span><input type="search" id="sq" placeholder="Title, publisher or URL" value="${esc(f.q)}" style="min-width:240px">
   <select id="st" aria-label="Tier"><option value="">All tiers</option>${[1,2,3,4,5].map(t=>`<option value="${t}" ${String(f.tier)===String(t)?'selected':''}>Tier ${t}</option>`).join('')}</select>
   <select id="si" aria-label="Institution"><option value="">All institutions</option>${INST.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(i=>`<option value="${i.id}" ${f.inst===i.id?'selected':''}>${esc(i.name)}</option>`).join('')}</select></div></div><div id="stable"></div></div>`; }
function drawSources(){ const f=S.src; const q=norm(f.q); const rows=Object.values(SRC).filter(s=>(!q||norm([s.title,s.publisher,s.url].join(' ')).includes(q))&&(!f.tier||String(s.tier)===String(f.tier))&&(!f.inst||s.institution_id===f.inst));
  const shown=rows.slice(0,500);
  $('stable').innerHTML=`<p class="small muted" style="margin-bottom:8px">${rows.length} sources${rows.length>500?' (first 500 shown)':''}.</p><div class="tbl-wrap"><table><thead><tr><th>Ref</th><th>Source</th><th class="hide-m">Institution</th><th>Type</th><th class="n">Tier</th><th class="hide-m">Published</th><th class="hide-m">Checked</th></tr></thead><tbody>
  ${shown.map(s=>`<tr><td class="mono">${esc(s.local_id)}</td><td>${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title||s.url)}</a>`:esc(s.title)}<span class="sub">${esc(s.publisher||'')}</span></td><td class="hide-m small">${BYID[s.institution_id]?instLink(BYID[s.institution_id]):''}</td><td class="small">${esc(s.doc_type)}</td><td class="n">${esc(s.tier)}</td><td class="hide-m small">${fmtDate(s.published)||'—'}</td><td class="hide-m small">${fmtDate(s.accessed)}</td></tr>`).join('')}</tbody></table></div>`; }
function bindSources(){ const f=S.src; $('sq').oninput=e=>{f.q=e.target.value;drawSources();}; $('st').onchange=e=>{f.tier=e.target.value;drawSources();}; $('si').onchange=e=>{f.inst=e.target.value;drawSources();}; drawSources(); }

function vMethod(){
  const fx=M.fx; return `<div class="stack"><div class="hero"><h1>Method and handover</h1><p class="lede">How the universe was defined, how facts were verified, how to read the statuses, and how to refresh the data.</p></div>
  <div class="section"><h2>Who is in, and why</h2><div class="prose"><ul>${M.universe.inclusion_criteria.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>
  <div class="section"><h2>Verification standard</h2><div class="prose"><ul>
   <li>Source hierarchy: (1) audited or reviewed financial statements, annual reports, regulatory and exchange filings; (2) official websites, leadership pages, press releases and investor presentations; (3) central banks and regulators; (4) official biographies and verified LinkedIn profiles; (5) reputable financial news for corroboration.</li>
   <li>Facts are cited at field level. Each metric records value, unit, original currency, period, consolidation scope, exact definition, source, page or section where available, publication date and date checked.</li>
   <li>AUM is never inferred from total assets, deposits, custody or fiduciary assets. Where it is not disclosed, the profile says “Not publicly disclosed” and where we looked.</li>
   <li>Executives are checked against the current official leadership page and recent appointment or departure news. LinkedIn URLs are recorded only when linked officially or matched on name, current employer and title; otherwise “Not verified”.</li>
   <li>Professional information only: no personal contact details, ages or personal characteristics.</li></ul></div></div>
  <div class="section"><h2>Statuses</h2><div class="tbl-wrap"><table><tbody>
   <tr><td>${pill('Verified')}</td><td class="small">Confirmed in a tier 1–2 source (or tier 3–4 for people), with date.</td></tr>
   <tr><td>${pill('Requires verification')}</td><td class="small">Only a weaker or older source found, or the role could not be confirmed on a current official page.</td></tr>
   <tr><td>${pill('Conflicting sources')}</td><td class="small">Sources disagree; the discrepancy is logged with both references.</td></tr>
   <tr><td>${pill('Not publicly disclosed')}</td><td class="small">Searched in the named documents; the institution does not publish it.</td></tr>
   <tr><td>${pill('Not found after research')}</td><td class="small">No reliable public evidence located; this is a research gap, not proof of absence.</td></tr></tbody></table></div></div>
  <div class="section"><h2>Reporting dates and FX</h2><div class="prose small"><p>Standard comparison: balance sheet at ${fmtDate(M.standard_balance_sheet_date)}; income ${esc(M.standard_income_period)}. Later figures (e.g. Q3 2026) are kept as extra records but are not used in comparisons.</p></div>
   <div class="tbl-wrap"><table><thead><tr><th>Currency</th><th class="n">Per USD</th><th>Basis</th></tr></thead><tbody>
   ${Object.entries(fx.pegged).filter(([c])=>c!=='USD').map(([c,v])=>`<tr><td class="mono">${c}</td><td class="n">${v.rate}</td><td class="small">${esc(v.source)}</td></tr>`).join('')}
   ${Object.entries(fx.KWD.point_rates).map(([d,r])=>`<tr><td class="mono">KWD</td><td class="n">${r}</td><td class="small">CBK rate at ${fmtDate(d)} (balance sheet)</td></tr>`).join('')}
   ${Object.entries(fx.KWD.average_rates).map(([d,v])=>`<tr><td class="mono">KWD</td><td class="n">${v.rate}</td><td class="small">${esc(v.source)} (income)</td></tr>`).join('')}</tbody></table></div></div>
  <div class="section"><h2>Refreshing the data</h2><div class="prose small"><ol>
   <li>Each institution is one file: <span class="mono">research/institutions/&lt;id&gt;.json</span> in the project folder, following <span class="mono">research/RESEARCH_PROTOCOL.md</span>.</li>
   <li>Edit or add a file (new results, a new appointment), keeping every value tied to a source with dates.</li>
   <li>Run <span class="mono">python3 tools/build_db.py</span>, then <span class="mono">python3 tools/build_workbook.py</span> and <span class="mono">python3 tools/build_site.py</span>. The QA report flags broken references, vocabulary errors and figures not at the standard date.</li>
   <li>Republish this site from the generated HTML. The Excel workbook and CSV/SQLite exports are regenerated from the same data, so all three stay in step.</li>
   <li>Twice a year, roll the standard dates forward (31 Dec for full-year results; 30 Jun for half-year) and re-verify leadership pages.</li></ol></div></div>
  </div>`;
}

/* ---------- router ---------- */
function render(){
  const h=(location.hash||'#home').slice(1); const [view, a, b]=h.split('.');
  let html, bind, nav=view;
  if(view==='i'){ html=vInstitution(a); nav='institutions'; bind=()=>{ const c=$('cmpOne'); if(c) c.onchange=()=>toggleCompare(a); $('page').querySelectorAll('[data-jump]').forEach(x=>x.onclick=e=>{e.preventDefault(); const t=$(x.dataset.jump); if(t) t.scrollIntoView({behavior:'smooth',block:'start'});}); }; }
  else if(view==='p'){ html=vPerson(a+':'+b); nav='people'; }
  else if(view==='institutions'){ html=vInstitutions(); bind=bindInstitutions; }
  else if(view==='people'){ html=vPeople(); bind=bindPeople; }
  else if(view==='compare'){ html=vCompare(); bind=bindCompare; }
  else if(view==='priorities'){ html=vPriorities(); bind=bindPriorities; }
  else if(view==='coverage'){ html=vCoverage(); }
  else if(view==='sources'){ html=vSources(); bind=bindSources; }
  else if(view==='method'){ html=vMethod(); }
  else { html=vHome(); nav='home'; bind=()=>$('page').querySelectorAll('[data-country]').forEach(x=>x.onclick=()=>{S.dir.c=[x.dataset.country];}); }
  $('page').innerHTML=html; drawNav(nav); if(bind) bind(); $('pop').hidden=true;
  if(view!=='i' || !window.__keepScroll) window.scrollTo(0,0);
  document.title = (view==='i'&&BYID[a]? BYID[a].name+' · ' : view==='p'&&PBYID[a+':'+b]? PBYID[a+':'+b].name+' · ' : '') + 'GCC FI Intelligence';
}
window.addEventListener('hashchange', render);
setCompare(S.compare); render();
</script>
